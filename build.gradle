plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = "pasterdream-fabric-${minecraft_version}"
}

repositories {
	flatDir {
		dirs 'libs'
	}
}

def localMod = { String fileName ->
	files("libs/${fileName}")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation localMod("gemini-${gemini_version}.jar")
	runtimeOnly files(
		"libs/gemini-runtime/META-INF/jars/core-3.8.0.jar",
		"libs/gemini-runtime/META-INF/jars/toml-3.8.0.jar"
	)
	modImplementation localMod(
		"curiosfabric-fabric-${minecraft_version}-${curiosfabric_version}.jar"
	)

	modImplementation include(
		"local:geckolib-fabric-${minecraft_version}:${geckolib_version}"
	)

	modImplementation include(
		"local:player-animation-lib-fabric:${playeranimator_version}"
	)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
        it.options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}

tasks.matching { it.name == "runServer" }.configureEach {
	if (it instanceof JavaExec) {
		it.executable = "C:\\Users\\Administrator\\.gradle\\jdks\\eclipse_adoptium-21-amd64-windows.2\\bin\\java.exe"
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
